<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Typewriter for Kids 🦁</title>

  <!-- Favicon (emoji) -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">

  <!-- Primary meta -->
  <meta name="description"
    content="A free typing game for kids! Spell animal names, hear each letter, and earn confetti rewards. 5 difficulty levels for ages 3–7.">


  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kids-typewriter.pages.dev/">
  <meta property="og:title" content="Typewriter for Kids 🦁">
  <meta property="og:description"
    content="A free typing game for kids! Spell animal names, hear each letter, and earn confetti rewards. 5 difficulty levels for ages 3–7.">
  <meta property="og:image" content="https://kids-typewriter.pages.dev/_media/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://kids-typewriter.pages.dev/">
  <meta name="twitter:title" content="Typewriter for Kids 🦁">
  <meta name="twitter:description"
    content="A free typing game for kids! Spell animal names, hear each letter, and earn confetti rewards. 5 difficulty levels for ages 3–7.">
  <meta name="twitter:image" content="https://kids-typewriter.pages.dev/_media/og-image.png">


  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Typewriter for Kids 🦁",
    "description": "A free typing game for kids! Spell animal names, hear each letter, and earn confetti rewards. 5 difficulty levels for ages 3–7.",
    "inLanguage": "en"
  }
  </script>

  <!-- DNS prefetch for external origins -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Fonts — preconnect + swap to avoid invisible text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <!-- Styles (Tailwind purged + custom, minified) -->
  <link rel="stylesheet" href="styles.build.css">

  <!-- Confetti — deferred so it never blocks rendering -->
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body
  class="bg-[#f0f9ff] text-gray-800 font-quicksand overflow-hidden h-screen flex flex-col items-center justify-start sm:justify-center relative">

  <!-- Start Screen -->
  <div id="start-screen"
    class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#f0f9ff] transition-opacity duration-500 px-4">
    <h1 class="text-4xl md:text-6xl font-bold text-center mb-2 text-[#ff9a9e]">Typewriter for Kids</h1>
    <p class="text-lg md:text-xl text-center mb-8 text-gray-500">Spell animals, earn stars! Choose a level to start 🌟
    </p>

    <div class="flex flex-col gap-3 w-full max-w-sm">

      <button
        class="level-btn bubbly-button flex items-center gap-4 px-6 py-4 bg-green-100 hover:bg-green-200 text-green-800 transition-colors shadow active:scale-95"
        data-level="1">
        <span class="text-2xl">⭐</span>
        <span class="flex flex-col items-start">
          <span class="font-bold text-lg leading-tight">Level 1</span>
          <span class="text-sm font-medium opacity-70">3-letter words</span>
        </span>
      </button>

      <button
        class="level-btn bubbly-button flex items-center gap-4 px-6 py-4 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 transition-colors shadow active:scale-95"
        data-level="2">
        <span class="text-2xl">⭐⭐</span>
        <span class="flex flex-col items-start">
          <span class="font-bold text-lg leading-tight">Level 2</span>
          <span class="text-sm font-medium opacity-70">4-letter words</span>
        </span>
      </button>

      <button
        class="level-btn bubbly-button flex items-center gap-4 px-6 py-4 bg-orange-100 hover:bg-orange-200 text-orange-800 transition-colors shadow active:scale-95"
        data-level="3">
        <span class="text-2xl">⭐⭐⭐</span>
        <span class="flex flex-col items-start">
          <span class="font-bold text-lg leading-tight">Level 3</span>
          <span class="text-sm font-medium opacity-70">5-letter words</span>
        </span>
      </button>

      <button
        class="level-btn bubbly-button flex items-center gap-4 px-6 py-4 bg-pink-100 hover:bg-pink-200 text-pink-800 transition-colors shadow active:scale-95"
        data-level="4">
        <span class="text-2xl">⭐⭐⭐⭐</span>
        <span class="flex flex-col items-start">
          <span class="font-bold text-lg leading-tight">Level 4</span>
          <span class="text-sm font-medium opacity-70">6–7 letter words</span>
        </span>
      </button>

      <button
        class="level-btn bubbly-button flex items-center gap-4 px-6 py-4 bg-purple-100 hover:bg-purple-200 text-purple-800 transition-colors shadow active:scale-95"
        data-level="5">
        <span class="text-2xl">⭐⭐⭐⭐⭐</span>
        <span class="flex flex-col items-start">
          <span class="font-bold text-lg leading-tight">Level 5</span>
          <span class="text-sm font-medium opacity-70">8+ letter words</span>
        </span>
      </button>

    </div>

    <!-- Chrome voice hint -->
    <div
      class="mt-6 w-full max-w-sm bg-blue-50 border border-blue-200 rounded-2xl px-4 py-3 text-xs text-blue-600 text-center leading-relaxed">
      🔊 <strong>Using Chrome and can't hear the voice?</strong><br>
      Type <code class="bg-blue-100 px-1 py-0.5 rounded font-mono select-all">chrome://restart</code> in the address bar
      and press Enter to restart Chrome.
    </div>

  </div>

  <!-- Main Game Container -->
  <div id="game-container"
    class="w-full max-w-3xl flex flex-col items-center justify-center p-4 mt-8 sm:mt-0 opacity-0 transition-opacity duration-500 pointer-events-none">

    <!-- Score Display -->
    <div class="absolute top-4 right-6 text-xl font-bold text-[#a1c4fd]">
      ⭐ <span id="score">0</span>
    </div>

    <!-- Level Badge -->
    <div class="absolute top-4 left-6 text-sm font-bold text-gray-400 bg-white shadow rounded-full px-3 py-1">
      <span id="level-badge">Level 1</span>
    </div>

    <!-- Congratulation Text -->
    <div id="congrats-text"
      class="text-3xl md:text-5xl font-bold text-[#ff9a9e] h-12 md:h-16 mb-2 opacity-0 transition-all duration-500 transform scale-50">
    </div>

    <!-- Animal Emoji -->
    <div id="emoji-display" class="text-8xl md:text-9xl mb-6 drop-shadow-md transition-transform duration-300">
      🐻
    </div>

    <!-- Word Card -->
    <div class="word-card w-full bg-white shadow-xl flex flex-col items-center justify-center p-8 md:p-12 mb-6">

      <!-- Word Container -->
      <div id="word-display"
        class="flex gap-2 md:gap-4 flex-wrap justify-center font-bold text-4xl md:text-6xl tracking-widest uppercase">
        <!-- Letters injected here via JS -->
      </div>

      <!-- Hint Dots -->
      <div id="hint-dots" class="flex gap-3 mt-8">
        <!-- Dots injected here via JS -->
      </div>

    </div>

  </div>

  <!-- Hidden Input for Mobile Keyboard -->
  <input type="text" id="hidden-input" class="opacity-0 absolute -z-10 pointer-events-none" autocomplete="off"
    autocorrect="off" autocapitalize="off" spellcheck="false" />

  <!-- App Script -->
  <script src="app.js"></script>

  <!-- Clarity — load during idle time so it never delays interactivity -->
  <script>
    (window.requestIdleCallback || setTimeout)(function () {
      (function (c, l, a, r, i, t, y) {
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
        t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "woh09n4jkv");
    });
  </script>
</body>

</html>
